name: TWRP Builder for SM-X216B (gta9p)

on:
  push:
    branches:
      - 'dyj7-prototype-01'
      - 'main'
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP for SM-X216B
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Check Out Repository
      uses: actions/checkout@v4

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "12G"

    - name: Prepare Ubuntu 24.04 Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip openjdk-11-jdk libtinfo6
        
        # Install repo tool
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Manifest
      run: |
        mkdir -p twrp
        cd twrp
        git config --global user.name "techv1"
        git config --global user.email "builder@techv1.local"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Integrate GTA9P Device Tree
      run: |
        # Copy current workspace into device path
        mkdir -p twrp/device/samsung/gta9p
        rsync -av --exclude='.git' --exclude='twrp' ./ twrp/device/samsung/gta9p/
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Building Recovery Image
      run: |
        cd twrp
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_gta9p-eng
        mka recoveryimage

    - name: Package Odin Tar
      run: |
        cd twrp/out/target/product/gta9p
        echo "Creating Odin flashable recovery.tar..."
        tar -cvf recovery.tar recovery.img
        sha256sum recovery.img recovery.tar > sha256sums.txt
        ls -la recovery.img recovery.tar

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          twrp/out/target/product/gta9p/recovery.img
          twrp/out/target/product/gta9p/recovery.tar
          twrp/out/target/product/gta9p/sha256sums.txt
        name: TWRP Unofficial DYJ7 Build - SM-X216B // ${{ env.BUILD_DATE }} (${{ env.COMMIT_SHA }})
        tag_name: build-${{ github.run_id }}
        body: |
          ## TWRP Recovery for Samsung Galaxy Tab A9+ 5G (SM-X216B / gta9p)
          - **Target Firmware:** X216BXXS9DYJ7 (Android 15)
          - **Kernel:** Stock 5.4.249-qgki-31053672-abX216BXXS9DYJ7
          - **DTBO:** Stock DYJ7 recovery DTBO (`himax_ts@2` with starry, lide, starry_agc panels)
          - **Touchscreen Driver:** Modular `himax_mmi.ko` + full prerequisite closure
          - **Himax Firmwares:** Full set included (including starry_agc)
          - **Commit:** ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
